<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 12 240 56" role="img" aria-label="sazzo">
  <!-- Logo de Sazzo para fondos oscuros (elegido el 08/10/2026): "sazzo" con la zz verde, punto verde en la o y
       una barrita (cursor) que titila al final. Letras dibujadas con trazos: no dependen de una tipografía. -->
  <style>
    .cursor { animation: titilar 1.1s steps(1) infinite; }
    @keyframes titilar { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#E6EFEB" d="M34.26 28.75 A13 7.5 0 1 0 23 40 A13 7.5 0 1 1 11.74 51.25"/>
    <circle stroke="#E6EFEB" cx="67" cy="40" r="15.4"/>
    <path stroke="#E6EFEB" d="M82.4 25 V55"/>
    <path stroke="#34D399" d="M98 25 H124 L98 55 H124"/>
    <path stroke="#34D399" d="M140 25 H166 L140 55 H166"/>
    <circle stroke="#E6EFEB" cx="197" cy="40" r="15.4"/>
  </g>
  <circle fill="#34D399" cx="197" cy="40" r="5"/>
  <path class="cursor" fill="none" stroke="#34D399" stroke-width="7" stroke-linecap="round" d="M231 24 V56"/>
</svg>
